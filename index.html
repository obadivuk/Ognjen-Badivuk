    <!-- Structured data: lets Google tie this site to the person (Knowledge Panel, rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://ognjenbadivuk.com/#person",
            "name": "Ognjen Badivuk",
            "givenName": "Ognjen",
            "familyName": "Badivuk",
            "url": "https://ognjenbadivuk.com/",
            "image": "https://ognjenbadivuk.com/ognjen-portrait.webp",
            "jobTitle": "Backend / Application Engineer",
            "description": "Backend and Application Engineer with 3+ years of experience building high-reliability data scraping systems, RESTful API integrations and ETL pipelines in PHP (Laravel) and Python.",
            "email": "mailto:ognjen.badivuk@gmail.com",
            "worksFor": {
              "@type": "Organization",
              "name": "Better Collective",
              "url": "https://bettercollective.com"
            },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Niš",
              "addressCountry": "RS"
            },
            "alumniOf": {
              "@type": "CollegeOrUniversity",
              "name": "Singidunum University"
            },
            "knowsAbout": [
              "PHP",
              "Python",
              "Laravel",
              "MySQL",
              "REST APIs",
              "Web Scraping",
              "ETL",
              "Data Pipelines",
              "Puppeteer",
              "AWS",
              "Unit Testing",
              "pytest",
              "PHPUnit"
            ],
            "sameAs": [
              "https://linkedin.com/in/ognjen-badivuk",
              "https://github.com/obadivuk"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://ognjenbadivuk.com/#website",
            "url": "https://ognjenbadivuk.com/",
            "name": "Ognjen Badivuk",
            "inLanguage": "en",
            "publisher": { "@id": "https://ognjenbadivuk.com/#person" }
          },
          {
            "@type": "ProfilePage",
            "@id": "https://ognjenbadivuk.com/#profilepage",
            "url": "https://ognjenbadivuk.com/",
            "name": "Ognjen Badivuk | Backend Engineer (PHP, Python, Laravel)",
            "isPartOf": { "@id": "https://ognjenbadivuk.com/#website" },
            "mainEntity": { "@id": "https://ognjenbadivuk.com/#person" }
          }
        ]
      }

    <!-- Hero portrait is the largest element on first paint; start fetching it before the JS runs -->
    <link
      rel="preload"
      as="image"
      href="/ognjen-portrait.webp"
      imagesrcset="/ognjen-portrait-sm.webp 520w, /ognjen-portrait.webp 1000w"
      imagesizes="(max-width: 640px) 78vw, (max-width: 1024px) 60vw, 34vw"
      fetchpriority="high"
    />

    <!-- Fonts load without blocking first paint (display=swap shows system fonts meanwhile) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
